<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network Unity</title>

<link rel="icon" type="image/png" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nova+Cut&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#000;
  color:#fff;
  height:100vh;
  overflow:hidden;
  font-family:"Nova Cut",system-ui,sans-serif;
}

canvas{
  position:fixed;
  inset:0;
  z-index:-1;
}

.center{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
}

.logo{
  width:120px;
  height:120px;
  opacity:0;
  animation:logoPop 1.1s ease forwards;
  filter:drop-shadow(0 0 22px rgba(255,255,255,.35));
}

@keyframes logoPop{
  0%{transform:scale(.6);opacity:0}
  70%{transform:scale(1.05);opacity:1}
  100%{transform:scale(1);opacity:1}
}

.title{
  margin-top:22px;
  font-size:2.6rem;
  letter-spacing:.2em;
  text-transform:uppercase;
  opacity:0;
  animation:titleIn 1.1s ease forwards;
  animation-delay:1.1s;
  text-shadow:0 0 16px rgba(255,255,255,.35);
}

@keyframes titleIn{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:1;transform:translateY(0)}
}

/* SEARCH */

.search-wrap{
  margin-top:24px;
  width:100%;
  display:flex;
  justify-content:center;
  opacity:0;
  animation:searchIn .8s ease forwards;
  animation-delay:1.45s;
}

@keyframes searchIn{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}

.search-box{
  width:420px;
  max-width:90%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 18px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  border-radius:18px;
  backdrop-filter:blur(14px);
}

.search-box input{
  flex:1;
  background:none;
  border:none;
  outline:none;
  color:#fff;
  font-size:.9rem;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.subtitle{
  margin-top:14px;
  font-size:.8rem;
  letter-spacing:.3em;
  text-transform:uppercase;
  opacity:.55;
}

/* NAV BAR */

.nav{
  position:fixed;
  bottom:26px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:20px;
  padding:14px 22px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.15);
  border-radius:26px;
  opacity:0;
  animation:navIn .8s ease forwards;
  animation-delay:2s;
}

@keyframes navIn{
  from{opacity:0;transform:translate(-50%,18px)}
  to{opacity:1;transform:translate(-50%,0)}
}

.nav a{
  width:46px;
  height:46px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.25s ease;
}

.nav a:hover{
  transform:translateY(-6px) scale(1.1);
  box-shadow:0 0 18px rgba(255,255,255,.25);
}

.nav img{
  width:24px;
  height:24px;
  object-fit:contain;
  filter:invert(1);
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="center">
  <img src="logo.png" class="logo">
  <div class="title">Network Unity</div>

  <div class="search-wrap">
    <div class="search-box">
      <input type="text" placeholder="Search the web">
    </div>
  </div>

  <div class="subtitle">Unified • Connected • Alive</div>
</div>

<!-- NAVBAR -->

<nav class="nav">

  <!-- Home -->
  <a href="index.html">
    <img src="logo.png">
  </a>

  <!-- Games (NEW ICON) -->
  <a href="games.html">
    <img src="g.png">
  </a>

  <!-- Apps -->
  <a href="apps.html">
    <img src="apps.png">
  </a>

  <!-- Movies -->
  <a href="movies.html">
    <img src="movies.png">
  </a>

  <!-- Settings -->
  <a href="settings.html">
    <img src="settings.png">
  </a>

</nav>

<script>
const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");

let w,h;
function resize(){
  w=canvas.width=innerWidth;
  h=canvas.height=innerHeight;
}
addEventListener("resize",resize);
resize();

const particles=[...Array(90)].map(()=>({
  x:Math.random()*w,
  y:Math.random()*h,
  r:Math.random()*1.4+.4,
  vx:(Math.random()-.5)*.28,
  vy:(Math.random()-.5)*.28
}));

(function animate(){
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle="rgba(255,255,255,.85)";
  particles.forEach(p=>{
    p.x+=p.vx;
    p.y+=p.vy;
    if(p.x<0||p.x>w)p.vx*=-1;
    if(p.y<0||p.y>h)p.vy*=-1;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  });
  requestAnimationFrame(animate);
})();
</script>

</body>
</html>
